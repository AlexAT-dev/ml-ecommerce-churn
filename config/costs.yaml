# ЛР3, Крок 5 — матриця бізнес-втрат (у.о. = умовні грошові одиниці, ~ масштаб CashbackAmount).
# Обґрунтування кожного числа — docs/lab3_report.md, §5. Рішення моделі: «позначити клієнта як ризик відтоку»
# → менеджер робить йому персональну утримувальну пропозицію.
assumptions:
  offer_cost: 50            # V: вартість пропозиції (знижка/бонус + робота менеджера)
  monthly_margin: 40        # M: маржинальний дохід від клієнта за місяць
  retained_months: 12       # L: скільки місяців у середньому залишається утриманий клієнт
  offer_success_rate: 0.35  # s: частка тих, хто збирався піти, але залишився завдяки пропозиції

# Похідні значення (C_ij: i — справжній клас, j — рішення; 1 = відтік / «позначити»)
#   CLV = M · L = 480
#   C00 = 0                       — нікого не чіпали, клієнт лишився
#   C01 = V = 50                  — пропозиція клієнту, який і так не пішов би (хибна тривога)
#   C10 = CLV = 480               — пропустили клієнта, він пішов
#   C11 = V + (1 − s) · CLV = 362 — пропозиція спрацювала лише з імовірністю s
matrix: {C00: 0, C01: 50, C10: 480, C11: 362}

# Ваги для class_weight — «регрет» рішення в кожному класі (різниця втрат між правильним і хибним рішенням):
#   w0 = C01 − C00 = 50,   w1 = C10 − C11 = s·CLV − V = 118
# Теоретично оптимальний поріг для каліброваних імовірностей: T* = w0 / (w0 + w1) = 50 / 168 ≈ 0.30
class_weight: {0: 50, 1: 118}

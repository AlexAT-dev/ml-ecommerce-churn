protected_attributes:
- CityTier
- Gender
feature_kinds:
  numeric_continuous: numeric
  numeric_binary: numeric
  categorical_nominal: categorical
  categorical_ordinal: categorical
  engineered_ratio: numeric
  engineered_stage: numeric
  high_cardinality: categorical
  multimodal_dfs: numeric
value_aliases:
  PreferredLoginDevice:
    Phone: Mobile Phone
  PreferredPaymentMode:
    CC: Credit Card
    COD: Cash on Delivery
  PreferedOrderCat:
    Mobile: Mobile Phone
imputation_policy:
  numeric:
  - max_share: 0.1
    strategy: median
  - max_share: 0.4
    strategy: median
    add_indicator: true
  - max_share: 1.0
    strategy: constant
    fill_value: 0
    add_indicator: true
  categorical:
  - max_share: 0.1
    strategy: most_frequent
  - max_share: 1.0
    strategy: constant
    fill_value: Missing
transform_policy:
  additive:
    numeric_continuous:
    - log1p
    - standard_scaler
    numeric_binary:
    - standard_scaler
    categorical_nominal:
    - woe
    categorical_ordinal:
    - ordinal_encoder
    - standard_scaler
    engineered_ratio:
    - yeo_johnson
    engineered_stage:
    - standard_scaler
    high_cardinality:
    - woe
    multimodal_dfs:
    - yeo_johnson
  partitioning:
    numeric_continuous:
    - winsorize:
        lower: 0.01
        upper: 0.99
    numeric_binary: []
    categorical_nominal:
    - one_hot
    categorical_ordinal:
    - ordinal_encoder
    engineered_ratio:
    - winsorize:
        lower: 0.01
        upper: 0.99
    engineered_stage: []
    high_cardinality:
    - woe
    multimodal_dfs:
    - winsorize:
        lower: 0.01
        upper: 0.99

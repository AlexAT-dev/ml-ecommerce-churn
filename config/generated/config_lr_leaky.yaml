# ЗГЕНЕРОВАНО ноутбуком 02_multimodal_leakage.ipynb — не редагувати вручну.
# = config_lr_fe.yaml + група multimodal_dfs (ознаки після мультимодальної екстракції та DFS).
# ЕКСПЕРИМЕНТ 4 (навмисний витік): oof_woe замінено на woe.
model_family: additive
feature_engineering:
- type: bins
  name: TenureStage
  source: Tenure
  edges:
  - 0
  - 1
  - 5
  - 12
  - 120
- type: ratio
  name: RecencyRatio
  numerator: DaySinceLastOrder
  denominator: Tenure
  denominator_scale: 30
  epsilon: 1.0
- type: ratio
  name: CashbackPerOrder
  numerator: CashbackAmount
  denominator: OrderCount
- type: ratio
  name: CouponPerOrder
  numerator: CouponUsed
  denominator: OrderCount
- type: ratio
  name: OrdersPerTenureMonth
  numerator: OrderCount
  denominator: Tenure
  epsilon: 1.0
- type: cross
  name: Segment
  sources:
  - PreferedOrderCat
  - MaritalStatus
  - SatisfactionScore
  - PreferredLoginDevice
features:
  numeric_continuous:
  - Tenure
  - WarehouseToHome
  - HourSpendOnApp
  - NumberOfDeviceRegistered
  - NumberOfAddress
  - OrderAmountHikeFromlastYear
  - CouponUsed
  - OrderCount
  - DaySinceLastOrder
  - CashbackAmount
  numeric_binary:
  - Complain
  categorical_nominal:
  - PreferredLoginDevice
  - PreferredPaymentMode
  - PreferedOrderCat
  - MaritalStatus
  categorical_ordinal:
  - SatisfactionScore
  engineered_ratio:
  - RecencyRatio
  - CashbackPerOrder
  - CouponPerOrder
  - OrdersPerTenureMonth
  engineered_stage:
  - TenureStage
  high_cardinality:
  - Segment
  multimodal_dfs:
  - COUNT(reviews)
  - MAX(reviews.has_image)
  - MAX(reviews.img_contrast)
  - MAX(reviews.img_correlation)
  - MAX(reviews.img_energy)
  - MAX(reviews.img_homogeneity)
  - MAX(reviews.rating)
  - MAX(reviews.review_dow_cos)
  - MAX(reviews.review_dow_sin)
  - MAX(reviews.review_hour_cos)
  - MAX(reviews.review_hour_sin)
  - MAX(reviews.text_len)
  - MAX(reviews.text_svd_0)
  - MAX(reviews.text_svd_1)
  - MAX(reviews.text_svd_2)
  - MAX(reviews.text_svd_3)
  - MAX(reviews.text_svd_4)
  - MEAN(reviews.has_image)
  - MEAN(reviews.img_contrast)
  - MEAN(reviews.img_correlation)
  - MEAN(reviews.img_energy)
  - MEAN(reviews.img_homogeneity)
  - MEAN(reviews.rating)
  - MEAN(reviews.review_dow_cos)
  - MEAN(reviews.review_dow_sin)
  - MEAN(reviews.review_hour_cos)
  - MEAN(reviews.review_hour_sin)
  - MEAN(reviews.text_len)
  - MEAN(reviews.text_svd_0)
  - MEAN(reviews.text_svd_1)
  - MEAN(reviews.text_svd_2)
  - MEAN(reviews.text_svd_3)
  - MEAN(reviews.text_svd_4)
  - CashbackAmount / CouponUsed
  - CashbackAmount / DaySinceLastOrder
  - CashbackAmount / HourSpendOnApp
  - CashbackAmount / OrderAmountHikeFromlastYear
  - CashbackAmount / OrderCount
  - CashbackAmount / Tenure
  - CashbackAmount / WarehouseToHome
  - CouponUsed / CashbackAmount
  - CouponUsed / DaySinceLastOrder
  - CouponUsed / HourSpendOnApp
  - CouponUsed / OrderAmountHikeFromlastYear
  - CouponUsed / OrderCount
  - CouponUsed / Tenure
  - CouponUsed / WarehouseToHome
  - DaySinceLastOrder / CashbackAmount
  - DaySinceLastOrder / CouponUsed
  - DaySinceLastOrder / HourSpendOnApp
  - DaySinceLastOrder / OrderAmountHikeFromlastYear
  - DaySinceLastOrder / OrderCount
  - DaySinceLastOrder / Tenure
  - DaySinceLastOrder / WarehouseToHome
  - HourSpendOnApp / CashbackAmount
  - HourSpendOnApp / CouponUsed
  - HourSpendOnApp / DaySinceLastOrder
  - HourSpendOnApp / OrderAmountHikeFromlastYear
  - HourSpendOnApp / OrderCount
  - HourSpendOnApp / Tenure
  - HourSpendOnApp / WarehouseToHome
  - OrderAmountHikeFromlastYear / CashbackAmount
  - OrderAmountHikeFromlastYear / CouponUsed
  - OrderAmountHikeFromlastYear / DaySinceLastOrder
  - OrderAmountHikeFromlastYear / HourSpendOnApp
  - OrderAmountHikeFromlastYear / OrderCount
  - OrderAmountHikeFromlastYear / Tenure
  - OrderAmountHikeFromlastYear / WarehouseToHome
  - OrderCount / CashbackAmount
  - OrderCount / CouponUsed
  - OrderCount / DaySinceLastOrder
  - OrderCount / HourSpendOnApp
  - OrderCount / OrderAmountHikeFromlastYear
  - OrderCount / Tenure
  - OrderCount / WarehouseToHome
